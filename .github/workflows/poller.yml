name: 24/7 Telegram News Bot

on:
  schedule:
    # Runs every 5 minutes 24/7 automatically in GitHub's cloud
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  poll-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Feeds & Dispatch Breaking News
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python main.py run --loop-seconds 240 --interval 60

      - name: Save & Commit Seen State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update news seen cache [skip ci]" && git push)

